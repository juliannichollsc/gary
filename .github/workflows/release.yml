name: Release

# Build the desktop installer and attach it to a GitHub Release.
# Non-technical users just download the .exe from the Releases page — no clone, no build.
#
# Trigger: push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`), or run manually.
# Windows (NSIS .exe) + Ubuntu (.deb + .AppImage). Each runner bundles for its own OS: Linux targets
# come from src-tauri/tauri.linux.conf.json (merged by Tauri only on Linux), so Windows stays untouched.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write            # needed to create the Release and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # 22.04 (glibc 2.35) so the .deb/.AppImage also run on newer Ubuntu releases.
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri v2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev build-essential curl wget file

      # Sin `version:` a propósito: la toma de `packageManager` en package.json (pnpm@11.1.2). Fijarla aquí
      # además crearía dos fuentes de verdad y action-setup@v4 aborta con ERR_PNPM_BAD_PM_VERSION.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # pnpm 11 (el que fija `packageManager`) requiere Node >= 22.13: usa `node:sqlite` para su store, un
      # built-in que Node 20 no tiene → ERR_UNKNOWN_BUILTIN_MODULE. Mantener esto >= 22.13.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build + publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GARY ${{ github.ref_name }}'
          releaseBody: |
            ## Download & install
            Grab the installer for your OS below and double-click.
            **Windows:** `GARY_x.y.z_x64-setup.exe` (NSIS).
            **Ubuntu/Debian:** `GARY_x.y.z_amd64.deb` (`sudo apt install ./GARY_*.deb`) or the portable
            `GARY_x.y.z_amd64.AppImage` (`chmod +x` and run). Requires Node >= 22.13 and Chrome/Chromium.

            > First launch may show a Windows SmartScreen notice ("Windows protected your PC")
            > because the installer isn't code-signed yet — click **More info → Run anyway**.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
